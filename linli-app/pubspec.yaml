name: linli
description: 林立 - 国产运动社交 App
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 地图 & 定位（自建 MapLibre 瓦片服务 map.bbtech.top，无需 token）
  maplibre_gl: ^0.26.1
  geolocator: ^13.0.0
  # 图片选图 + 裁剪（头像用）
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  # 角标（通知未读数）
  badges: ^3.1.2

  # UI 组件
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # 工具
  dio: ^5.8.0+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  permission_handler: ^11.4.0
  latlong2: ^0.9.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  path: ^1.9.0

  # 工具（path_provider 由 shared_preferences 间接依赖）
  path_provider: ^2.1.5

  # 分享（GPX 文件导出用）
  share_plus: ^10.1.4

  # 图标
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
