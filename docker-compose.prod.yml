# ============================================
# 林立生产环境部署清单（api.bbtech.top）
# ============================================
# 启动：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# 停止：docker compose -f docker-compose.prod.yml down
# 看日志：docker compose -f docker-compose.prod.yml logs -f
# ============================================
#
# 注意：
# - api 服务用预构建镜像 linli-api:latest（在 Mac 上 buildx 构建 linux/amd64 后导入服务器）
#   服务器上需先 `docker load < linli-api.tar.gz`
# - 端口绑 127.0.0.1:8081（只本机访问），由外部 Caddy 反代到 api.bbtech.top
# - PostgreSQL 内存调小，适合 2GB 服务器
# ============================================

services:
  # ---- 数据库 ----
  db:
    image: postgis/postgis:16-3.4
    container_name: linli-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: linli
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./linli-server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linli"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 内存调小（适合 2GB 服务器）
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=256MB
      -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 512M
    # 数据库不对外暴露（只容器间通信）
    networks:
      - linli-net

  # ---- Rust 后端（服务器现场构建）----
  api:
    build:
      context: ./linli-server
      dockerfile: Dockerfile
    image: linli-api:latest
    container_name: linli-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/linli
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_HOURS: 168
      CORS_ORIGINS: ${CORS_ORIGINS}
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      # 只绑本机回环，由 Caddy 反代；端口 8081 避开 linli_map 的 8080
      - "127.0.0.1:8081:8080"
    networks:
      - linli-net
    deploy:
      resources:
        limits:
          memory: 200M

networks:
  linli-net:
    driver: bridge

volumes:
  pgdata:
